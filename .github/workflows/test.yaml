name: Test

on: push

jobs:
  classic:
    name: classic (ava)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: make ci

  kit:
    name: kit (unit + i8080 ex1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 25.x
      - run: just test-ci

  kit-bench-node:
    name: kit (i8080 ex1, node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 25.x
      - run: just test-ex1-node
