name: kit

on: push

jobs:
  test:
    name: kit (unit + i8080 ex1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 25.x
      - run: just test-ci

  bench-node:
    name: kit (i8080 ex1, node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 25.x
      - run: just test-ex1-node
